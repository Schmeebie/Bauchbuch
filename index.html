<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bauchbuch">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F4F3F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141219" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Bauchbuch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&display=swap">
<style>
/* Layout: one narrow pocket-diary column, thumb-sized buttons, fixed tab bar at the bottom */
:root{
  --bg:#F4F3F7; --surface:#FFFFFF; --sunk:#EAE8F0; --ink:#1C1923; --muted:#625D75; --line:#DCD9E5;
  --accent:#3D3796; --accent-soft:#E4E2F6; --on-accent:#FFFFFF;
  --sym1:#B07106; --sym2:#B23A57; --sym3:#6A55CC; --sym4:#1F7466; --sym5:#4F6C8C; --sym6:#9A4FA8;
  --cry:#2F6FB5; --stress:#B4532A; --period:#C8303C; --measure:#5E7A1A; --danger:#B3261E;
  --toast-bg:#1C1923; --toast-fg:#F4F3F7; --toast-act:#C9C4FF;
  --shadow:0 1px 2px rgba(28,25,35,.08), 0 4px 14px rgba(28,25,35,.06);
  --f-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",-apple-system,"Segoe UI",system-ui,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141219; --surface:#1E1B26; --sunk:#282432; --ink:#EDEAF4; --muted:#A49FB5; --line:#332E3F;
    --accent:#A8A1FF; --accent-soft:#2B2747; --on-accent:#16131F;
    --sym1:#E6A93A; --sym2:#EC7F98; --sym3:#A897FF; --sym4:#5FC2AF; --sym5:#93AFCF; --sym6:#D08DDC;
    --cry:#78AEEB; --stress:#F0A070; --period:#FF8F8A; --measure:#B6D36A; --danger:#F2867E;
    --toast-bg:#EDEAF4; --toast-fg:#141219; --toast-act:#3D3796;
    --shadow:0 1px 2px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141219; --surface:#1E1B26; --sunk:#282432; --ink:#EDEAF4; --muted:#A49FB5; --line:#332E3F;
  --accent:#A8A1FF; --accent-soft:#2B2747; --on-accent:#16131F;
  --sym1:#E6A93A; --sym2:#EC7F98; --sym3:#A897FF; --sym4:#5FC2AF; --sym5:#93AFCF; --sym6:#D08DDC;
  --cry:#78AEEB; --stress:#F0A070; --period:#FF8F8A; --measure:#B6D36A; --danger:#F2867E;
  --toast-bg:#EDEAF4; --toast-fg:#141219; --toast-act:#3D3796;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.35;cursor:default}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
label:focus-within{outline:3px solid var(--accent);outline-offset:2px}
label:has(input:not(:focus-visible)):focus-within{outline:none}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;padding:0;margin:-1px}
svg{flex:none}

.app{max-width:520px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px calc(104px + env(safe-area-inset-bottom,0px))}
#main{display:flex;flex-direction:column;gap:28px}
section{display:flex;flex-direction:column;gap:10px}

h1{font-family:var(--f-display);font-weight:700;font-size:2.15rem;line-height:1.05;letter-spacing:-.015em;margin:0;text-wrap:balance}
h2{margin:0}
.label{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.hint{font-size:.85rem;color:var(--muted)}
.sub{margin:4px 0 0;color:var(--muted);font-size:.95rem}
.prose{margin:0;color:var(--muted);max-width:60ch}

/* Day header */
.dayhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-top:6px}
.daynav{display:flex;gap:6px;align-items:center}
.icon-btn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.pill{height:44px;padding:0 14px;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-weight:700}

/* Food */
.snap{display:flex;align-items:center;gap:14px;padding:16px 18px;min-height:80px;border-radius:var(--r);background:var(--accent);color:var(--on-accent);cursor:pointer;box-shadow:var(--shadow);position:relative}
.snap-ico{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--on-accent) 16%,transparent)}
.snap strong{display:block;font-family:var(--f-display);font-size:1.25rem;font-weight:700;line-height:1.15}
.snap small{display:block;font-size:.85rem;opacity:.82}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn2{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-weight:700;cursor:pointer;text-align:center;position:relative}

/* Symptoms */
.symgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.sym{display:grid;grid-template-columns:12px minmax(0,1fr) auto;align-items:center;gap:10px;min-height:66px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-align:left;font-weight:700;line-height:1.2;transition:background-color .25s}
.sym>span:nth-child(2){min-width:0;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word}
.sym:active{background:color-mix(in srgb,var(--c) 16%,var(--surface))}
.sym.flash{animation:flash .6s ease-out}
@keyframes flash{0%{background:color-mix(in srgb,var(--c) 30%,var(--surface));border-color:var(--c)}100%{background:var(--surface)}}
.dot{width:12px;height:12px;border-radius:50%;background:var(--c);display:inline-block}
.count{font-size:.85rem;color:var(--c);font-variant-numeric:tabular-nums}
.sym-add{grid-column:1/-1;display:flex;justify-content:center;min-height:46px;border-style:dashed;color:var(--muted);font-weight:700}
.sym-add.half{grid-column:auto}
h3{margin:0}
.reuse{display:flex;flex-direction:column;gap:8px;padding-top:6px}
.strip{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;padding:2px 2px 6px;margin-inline:-2px;-webkit-overflow-scrolling:touch}
.rcard{flex:0 0 96px;display:flex;flex-direction:column;gap:4px;text-align:left;scroll-snap-align:start;min-width:0}
.rimg{position:relative;width:96px;height:96px;max-width:100%;border-radius:12px;overflow:hidden;background:var(--sunk);display:grid;place-items:center;color:var(--muted)}
.rimg img{width:100%;height:100%;object-fit:cover;display:block}
.rcard:active .rimg{transform:scale(.96)}
.rname{font-size:.85rem;font-weight:700;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.rmeta{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.done{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 0 0 2px var(--surface)}
.rcard.more .rimg{background:transparent;border:1.5px dashed var(--line);color:var(--accent)}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 10px}
.pgrid .rcard{flex:none}
.pgrid .rimg{width:100%;height:auto;aspect-ratio:1}
.addsym{display:flex;gap:8px;flex-wrap:wrap}
.addsym input{flex:1 1 180px;min-width:0;min-height:46px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.btn-accent{min-height:46px;padding:0 18px;border-radius:12px;background:var(--accent);color:var(--on-accent);font-weight:700}
.btn-ghost{min-height:46px;padding:0 14px;border-radius:12px;color:var(--muted);font-weight:700}
.btn-danger{min-height:46px;padding:0 18px;border-radius:12px;background:var(--danger);color:var(--surface);font-weight:700}
.danger-text{color:var(--danger)}

/* Segmented */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:14px;background:var(--sunk)}
.seg.seg3{grid-template-columns:repeat(3,1fr)}
.seg button{min-height:46px;border-radius:11px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg button.yes[aria-pressed="true"]{background:var(--cry);color:var(--on-accent)}
.seg.seg5{grid-template-columns:repeat(5,minmax(0,1fr))}
.seg button.stress{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:58px;padding:4px 2px}
.seg button.stress b{font-family:var(--f-display);font-size:1.3rem;line-height:1;font-variant-numeric:tabular-nums}
.seg button.stress small{font-size:.72rem;font-weight:700}
.seg button.stress[aria-pressed="true"]{background:var(--stress);color:var(--on-accent)}
.cell.lo{color:var(--ink)}
.seg.seg4{grid-template-columns:repeat(4,minmax(0,1fr))}
.seg button.two{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;padding:4px 3px;line-height:1.12;text-align:center}
.seg button.two small{font-size:.7rem;font-weight:700;opacity:.85}
.seg button.bleed[aria-pressed="true"]{background:var(--period);color:var(--on-accent)}
.cyc-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.cyc{width:100%;border-collapse:collapse;font-size:.9rem}
.cyc th,.cyc td{padding:8px 4px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
.cyc thead th{font-size:.78rem;color:var(--muted);vertical-align:bottom;line-height:1.2}
.cyc thead th small{display:block;font-weight:400;font-variant-numeric:tabular-nums}
.cyc tbody th{font-weight:700;min-width:104px;line-height:1.2}
.cyc tbody th .dot{margin-right:6px}
.pc{display:block;min-width:56px;padding:3px 6px;border-radius:6px;font-variant-numeric:tabular-nums;font-weight:700;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 32%,transparent) var(--v),var(--sunk) var(--v))}
.pc.na{background:none;color:var(--muted);font-weight:400}

/* Timeline */
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.tl-item{width:100%;display:grid;grid-template-columns:46px 46px minmax(0,1fr) 14px;align-items:center;gap:12px;padding:7px 8px;border-radius:12px;text-align:left}
.tl-item:hover{background:var(--sunk)}
.tl-item time{font-variant-numeric:tabular-nums;font-weight:700;color:var(--muted)}
.thumb{width:46px;height:46px;border-radius:10px;object-fit:cover;background:var(--sunk);display:grid;place-items:center;color:var(--muted)}
.marker{width:46px;height:46px;border-radius:10px;background:color-mix(in srgb,var(--c) 15%,transparent);display:grid;place-items:center}
.marker::after{content:"";width:14px;height:14px;border-radius:50%;background:var(--c)}
.marker.mk-mea::after{width:12px;height:12px;border-radius:3px;transform:rotate(45deg)}
.dia{display:inline-block;flex:none;width:9px;height:9px;border-radius:2px;background:var(--measure);transform:rotate(45deg);margin:0 7px 1px 2px;vertical-align:middle}
.sym.mea{grid-template-columns:18px minmax(0,1fr) auto}
.sym.mea svg{color:var(--c)}
.tl-text{min-width:0;display:flex;flex-direction:column}
.tl-title{font-weight:700}
.sev{color:var(--muted);font-weight:400}
.tl-note{color:var(--muted);font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--muted)}
.empty{margin:0;padding:18px;border-radius:14px;border:1px dashed var(--line);color:var(--muted);text-align:center}
.cry-note{display:flex;align-items:center;gap:10px;font-size:.9rem;color:var(--muted);padding:4px 8px}

/* History */
.summary{margin:0;font-size:1.05rem;max-width:52ch}
.summary b{font-variant-numeric:tabular-nums}
.matrix-wrap{overflow-x:auto;margin-inline:-4px;padding:2px 4px 6px;-webkit-overflow-scrolling:touch}
.matrix{border-collapse:separate;border-spacing:3px 5px}
.matrix th{font-weight:700}
.matrix thead th{font-size:.7rem;text-align:center;color:var(--muted);line-height:1.15;min-width:26px}
.matrix thead th .dn{display:block;font-size:.85rem;color:var(--ink);font-variant-numeric:tabular-nums}
.matrix thead th.is-today .dn,.matrix thead th.is-today{color:var(--accent)}
.matrix tbody th{position:sticky;left:0;z-index:1;background:var(--bg);text-align:left;font-size:.82rem;line-height:1.15;padding-right:8px;min-width:96px;max-width:118px}
.cell{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:.7rem;font-weight:700;color:var(--on-accent);background:color-mix(in srgb,var(--c) var(--p),var(--sunk));font-variant-numeric:tabular-nums}
.cell.zero{background:var(--sunk)}
.cell.no{background:transparent;box-shadow:inset 0 0 0 2px var(--line)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .cell{width:14px;height:14px;border-radius:4px}
.daylist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.dayrow{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-align:left}
.dayrow strong{display:block}
.dayrow small{color:var(--muted)}
.thumbs{display:flex}
.thumbs img{width:34px;height:34px;border-radius:8px;object-fit:cover;border:2px solid var(--surface);margin-left:-8px}
.thumbs img:first-child{margin-left:0}
.chips{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;background:var(--sunk);font-size:.82rem}
.chip .dot{width:8px;height:8px}

/* Data */
.stack{display:flex;flex-direction:column;gap:8px}
.action{display:flex;align-items:center;gap:14px;width:100%;min-height:60px;padding:12px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-align:left;cursor:pointer;position:relative}
.action strong{display:block}
.action small{display:block;color:var(--muted);font-size:.85rem}
.action svg{color:var(--accent)}
.facts{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:.95rem}
.facts dt{color:var(--muted)}
.facts dd{margin:0;font-variant-numeric:tabular-nums}
.symrow{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.symrow span.n{flex:1;min-width:0}
.symrow.off span.n{color:var(--muted);text-decoration:line-through}
.symrow button{min-height:40px;padding:0 12px;border-radius:10px;background:var(--sunk);font-weight:700;font-size:.9rem}
.banner{padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--danger) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--danger) 35%,transparent);font-size:.95rem}
.note-box{padding:12px 14px;border-radius:14px;background:var(--accent-soft);font-size:.95rem}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabbar-inner{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 10px;color:var(--muted);font-size:.75rem;font-weight:700}
.tab[aria-current="page"]{color:var(--accent)}

/* Toast */
.toast{position:fixed;z-index:40;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(78px + env(safe-area-inset-bottom,0px));max-width:488px;margin:0 auto;display:flex;align-items:center;gap:4px 14px;flex-wrap:wrap;padding:12px 16px;border-radius:14px;background:var(--toast-bg);color:var(--toast-fg);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast span{flex:1 1 160px;min-width:0}
.toast button{color:var(--toast-act);font-weight:700;min-height:36px}

/* Sheet */
.sheet{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(10,8,16,.45)}
.panel{position:relative;width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;
  padding:20px max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:16px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}}
.panel h2{font-family:var(--f-display);font-size:1.5rem;font-weight:700;display:flex;align-items:center;gap:10px;line-height:1.15}
.sheet-photo{width:100%;max-height:42vh;object-fit:contain;border-radius:14px;background:var(--sunk)}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.flabel{font-weight:700;font-size:.92rem}
.opt{font-weight:400;color:var(--muted)}
.field input[type=time]{min-height:48px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-variant-numeric:tabular-nums;font-size:1.1rem;max-width:180px}
.field textarea{padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);resize:vertical;min-height:52px}
.panel-foot,.confirm{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.confirm span{flex:1;font-weight:700}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>


<div class="app">
  <main id="main" aria-live="off"></main>
</div>

<nav class="tabbar" aria-label="Bereiche">
  <div class="tabbar-inner">
    <button class="tab" data-tab="tag">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/><circle cx="12" cy="15" r="1.6" fill="currentColor" stroke="none"/></svg>
      Tag
    </button>
    <button class="tab" data-tab="verlauf">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>
      Verlauf
    </button>
    <button class="tab" data-tab="daten">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 7.8-8 9-4.6-1.2-8-4.5-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>
      Daten
    </button>
  </div>
</nav>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<div id="sheet" class="sheet" hidden>
  <div class="scrim" data-close="1"></div>
  <div class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="ed-title" tabindex="-1"></div>
</div>

<script>
(function(){
"use strict";
document.documentElement.lang='de';

/* ---------- Basics ---------- */
const DEFAULT_SYMPTOMS=[
  {id:'blaehbauch',name:'Blähbauch',color:1},
  {id:'kraempfe',name:'Krämpfe',color:2},
  {id:'bauchschmerzen-leicht',name:'Leichte Bauchschmerzen',color:5,noSev:true},
  {id:'bauchschmerzen-stark',name:'Starke Bauchschmerzen',color:3,noSev:true},
  {id:'durchfall',name:'Durchfall',color:4}
];
const NEW_PAIN=DEFAULT_SYMPTOMS.filter(s=>s.id.startsWith('bauchschmerzen-'));
const SEV=[{v:1,l:'Leicht'},{v:2,l:'Mittel'},{v:3,l:'Stark'}];
const STRESS=['Kein','Leicht','Mittel','Stark','Extrem'];
const STRESS_P=[14,35,55,78,100];
const DEFAULT_MEASURES=[{id:'buscopan',name:'Buscopan'},{id:'lefax',name:'Lefax'},{id:'koernerkissen',name:'Körnerkissen'},{id:'tee',name:'Tee'}];
const WHY={prev:'Vorbeugend',acute:'Gegen Beschwerden'};
const FLOW_ORDER=['none','spot','light','heavy'];
const FLOW={none:{l:'Keine',s:''},spot:{l:'Schmier\u00ADblutung',s:''},light:{l:'Leicht',s:'beginnt / endet'},heavy:{l:'Stark',s:'voll da'}};
const FLOW_TXT={none:'Keine Periode',spot:'Schmierblutung',light:'Periode leicht',heavy:'Periode stark'};
const FLOW_P={spot:30,light:62,heavy:100};
const S={view:'tag',day:'',entries:[],days:new Map(),symptoms:[],measures:[],persistent:false,storageOk:true,addingSym:false,addingMea:false};
const $=s=>document.querySelector(s);
const main=$('#main'),panel=$('#panel'),sheet=$('#sheet');

const pad=n=>String(n).padStart(2,'0');
const dayKey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayKey=()=>dayKey(new Date());
const parseDay=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(k,n)=>{const d=parseDay(k);d.setDate(d.getDate()+n);return dayKey(d)};
const hhmm=ts=>{const d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes())};
const fmtDE=k=>k.split('-').reverse().join('.');
const fmtLong=new Intl.DateTimeFormat('de-DE',{weekday:'long',day:'numeric',month:'long'});
const fmtWd=new Intl.DateTimeFormat('de-DE',{weekday:'short'});
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const meaOf=e=>S.measures.find(m=>m.id===e.mea)||{name:e.name};
const symOf=e=>S.symptoms.find(s=>s.id===e.sym)||{name:e.name,color:e.color||5};
const inFrame=(()=>{try{return window.self!==window.top}catch(e){return true}})();
const pk=e=>e.photoKey||e.id;
const bleeding=d=>{const f=(S.days.get(d)||{}).flow;return f==='light'||f==='heavy'};
function periodStarts(){
  // First bleeding day with no bleeding in the 7 days before it
  return [...S.days.keys()].filter(bleeding).sort().filter(d=>{for(let i=1;i<=7;i++)if(bleeding(addDays(d,-i)))return false;return true});
}
const daysBetween=(a,b)=>Math.round((parseDay(b)-parseDay(a))/864e5);
function cycleDay(k){
  const st=periodStarts().filter(x=>x<=k);if(!st.length)return null;
  const n=daysBetween(st[st.length-1],k)+1;return n<=60?n:null;
}
const fmtDM=k=>{const p=k.split('-');return (+p[2])+'.'+(+p[1])+'.'};
const reusable=e=>e.type==='food'&&(e.hasPhoto||!!(e.note&&e.note.trim()));
const mealKey=e=>(e.hasPhoto?pk(e):'')+'|'+(e.note||'').trim().toLowerCase();
S.day=todayKey();

/* ---------- Storage (IndexedDB, falls back to memory) ---------- */
let db=null;
const mem={entries:new Map(),days:new Map(),meta:new Map(),photos:new Map()};
const KEYS={entries:'id',days:'day',meta:'k'};
function openDB(){return new Promise((res,rej)=>{
  let r;try{r=indexedDB.open('bauchbuch',1)}catch(e){rej(e);return}
  r.onupgradeneeded=()=>{const d=r.result;
    const e=d.createObjectStore('entries',{keyPath:'id'});e.createIndex('day','day');
    d.createObjectStore('days',{keyPath:'day'});d.createObjectStore('meta',{keyPath:'k'});d.createObjectStore('photos');};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'));
});}
function run(name,mode,fn){return new Promise((res,rej)=>{
  const t=db.transaction(name,mode);const r=fn(t.objectStore(name));let out;
  if(r)r.onsuccess=()=>{out=r.result};
  t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);
});}
const store={
  put(name,val,key){if(!db){mem[name].set(key!==undefined?key:val[KEYS[name]],val);return Promise.resolve()}
    return run(name,'readwrite',s=>key===undefined?s.put(val):s.put(val,key))},
  del(name,key){if(!db){mem[name].delete(key);return Promise.resolve()}return run(name,'readwrite',s=>s.delete(key))},
  get(name,key){if(!db)return Promise.resolve(mem[name].get(key));return run(name,'readonly',s=>s.get(key))},
  all(name){if(!db)return Promise.resolve([...mem[name].values()]);return run(name,'readonly',s=>s.getAll())}
};
async function safe(p){try{await p;return true}catch(e){toast('Speichern hat nicht geklappt. Bitte noch einmal versuchen.');return false}}

/* ---------- Actions ---------- */
function defaultTs(){
  if(S.day===todayKey())return Date.now();
  return parseDay(S.day).setHours(12,0,0,0);
}
async function saveEntry(e){
  const i=S.entries.findIndex(x=>x.id===e.id);
  if(i>=0)S.entries[i]=e;else S.entries.push(e);
  render();
  return safe(store.put('entries',e));
}
async function removeEntry(id,msg){
  const gone=S.entries.find(e=>e.id===id);
  S.entries=S.entries.filter(e=>e.id!==id);
  render();
  const ops=[store.del('entries',id)];
  if(gone&&gone.hasPhoto){const k=pk(gone);if(!S.entries.some(e=>e.hasPhoto&&pk(e)===k))ops.push(store.del('photos',k))}
  await safe(Promise.all(ops));
  if(msg)toast(msg);
}
async function repeatMeal(srcId){
  const src=S.entries.find(e=>e.id===srcId);if(!src)return;
  const e={id:uid(),type:'food',day:S.day,ts:defaultTs(),thumb:src.thumb||null,hasPhoto:!!src.hasPhoto,note:src.note||''};
  if(src.hasPhoto)e.photoKey=pk(src);
  await saveEntry(e);
  const name=(e.note||'').trim()||'Essen';
  if(S.day===todayKey()){
    toast(name+' · '+hhmm(e.ts)+' eingetragen',[
      {label:'Rückgängig',fn:()=>removeEntry(e.id,'Rückgängig gemacht')},
      {label:'Uhrzeit ändern',fn:()=>openEditor(e.id)}]);
  }else openEditor(e.id,'Stell die Uhrzeit der Mahlzeit ein.');
}
async function logSymptom(id,btn){
  const sym=S.symptoms.find(s=>s.id===id);if(!sym)return;
  const isToday=S.day===todayKey();
  const e={id:uid(),type:'symptom',day:S.day,ts:defaultTs(),sym:id,name:sym.name,color:sym.color,sev:null,note:''};
  await saveEntry(e);
  const b=main.querySelector('.sym[data-id="'+id+'"]');
  if(b){b.classList.remove('flash');void b.offsetWidth;b.classList.add('flash')}
  if(isToday){
    toast(sym.name+' · '+hhmm(e.ts)+' eingetragen',[
      {label:'Rückgängig',fn:()=>removeEntry(e.id,'Rückgängig gemacht')},
      {label:sym.noSev?'Uhrzeit ändern':'Stärke',fn:()=>openEditor(e.id)}]);
  }else openEditor(e.id,'Stell die Uhrzeit ein, zu der es an diesem Tag war.');
}
async function logMeasure(id){
  const m=S.measures.find(x=>x.id===id);if(!m)return;
  const e={id:uid(),type:'measure',day:S.day,ts:defaultTs(),mea:id,name:m.name,why:null,note:''};
  await saveEntry(e);
  const b=main.querySelector('.mea[data-id="'+id+'"]');
  if(b){b.classList.remove('flash');void b.offsetWidth;b.classList.add('flash')}
  if(S.day===todayKey()){
    toast(m.name+' · '+hhmm(e.ts)+' eingetragen',[
      {label:'Rückgängig',fn:()=>removeEntry(e.id,'Rückgängig gemacht')},
      {label:'Vorbeugend',fn:()=>{e.why='prev';saveEntry(e);toast(m.name+' als vorbeugend markiert')}},
      {label:'Details',fn:()=>openEditor(e.id)}]);
  }else openEditor(e.id,'Stell die Uhrzeit ein, zu der es an diesem Tag war.');
}
const saveMeasures=()=>safe(store.put('meta',{k:'measures',list:S.measures}));
async function addMeasure(name){
  name=name.trim();if(!name)return;
  if(S.measures.some(m=>m.name.toLowerCase()===name.toLowerCase())){toast('„'+name+'“ gibt es schon.');return}
  S.measures.push({id:'m'+uid(),name,custom:true});
  S.addingMea=false;render();await saveMeasures();
}
function loadImg(url){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('img'));i.src=url})}
async function processImage(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await loadImg(url);
    const w=img.naturalWidth,h=img.naturalHeight,sc=Math.min(1,1400/Math.max(w,h));
    const c=document.createElement('canvas');c.width=Math.round(w*sc);c.height=Math.round(h*sc);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    const full=await new Promise(r=>c.toBlob(r,'image/jpeg',0.8));
    if(!full)throw new Error('blob');
    const T=192,t=document.createElement('canvas'),s=Math.min(w,h);t.width=T;t.height=T;
    t.getContext('2d').drawImage(img,(w-s)/2,(h-s)/2,s,s,0,0,T,T);
    return {full,thumb:t.toDataURL('image/jpeg',0.72)};
  }finally{URL.revokeObjectURL(url)}
}
async function addPhotos(files){
  const list=[...files];if(!list.length)return;
  let last=null,ok=0;
  for(const f of list){
    try{
      const {full,thumb}=await processImage(f);
      let ts=defaultTs();const lm=f.lastModified,now=Date.now();
      if(lm&&dayKey(new Date(lm))===S.day&&lm<=now&&now-lm>120000)ts=lm;
      const e={id:uid(),type:'food',day:S.day,ts,thumb,hasPhoto:true,note:''};
      if(!(await safe(store.put('photos',full,e.id))))continue;
      await saveEntry(e);last=e;ok++;
    }catch(err){toast('Das Foto ließ sich nicht öffnen. Versuch es mit einem anderen.')}
  }
  if(!last)return;
  if(ok===1&&S.day===todayKey()){
    toast('Essen · '+hhmm(last.ts)+' gespeichert',[
      {label:'Rückgängig',fn:()=>removeEntry(last.id,'Rückgängig gemacht')},
      {label:'Uhrzeit ändern',fn:()=>openEditor(last.id)}]);
  }else if(ok===1)openEditor(last.id,'Stell die Uhrzeit der Mahlzeit ein.');
  else toast(ok+' Fotos gespeichert. Uhrzeiten kannst du im Tagesverlauf anpassen.');
}
async function addMealNoPhoto(){
  const e={id:uid(),type:'food',day:S.day,ts:defaultTs(),thumb:null,hasPhoto:false,note:''};
  await saveEntry(e);openEditor(e.id);
}
async function setDay(field,v){
  const cur=Object.assign({day:S.day},S.days.get(S.day)||{});
  if(cur[field]===v)delete cur[field];else cur[field]=v;
  if(!Object.keys(cur).some(k=>k!=='day'&&cur[k]!=null)){S.days.delete(S.day);render();await safe(store.del('days',S.day))}
  else{S.days.set(S.day,cur);render();await safe(store.put('days',cur))}
}
const saveSymptoms=()=>safe(store.put('meta',{k:'symptoms',list:S.symptoms}));
async function addSymptom(name){
  name=name.trim();if(!name)return;
  if(S.symptoms.some(s=>s.name.toLowerCase()===name.toLowerCase())){toast('„'+name+'“ gibt es schon.');return}
  const used=new Set(S.symptoms.filter(s=>!s.hidden).map(s=>s.color));
  const color=[5,6,1,2,3,4].find(c=>!used.has(c))||(S.symptoms.length%6)+1;
  S.symptoms.push({id:'s'+uid(),name,color,custom:true});
  S.addingSym=false;render();await saveSymptoms();
}

/* ---------- Toast ---------- */
let toastTimer;
function toast(msg,actions){
  actions=actions||[];const t=$('#toast');
  t.innerHTML='<span>'+esc(msg)+'</span>'+actions.map((a,i)=>'<button type="button" data-i="'+i+'">'+esc(a.label)+'</button>').join('');
  t.hidden=false;
  t.onclick=ev=>{const b=ev.target.closest('button');if(!b)return;hideToast();actions[+b.dataset.i].fn()};
  clearTimeout(toastTimer);toastTimer=setTimeout(hideToast,actions.length?6500:3500);
}
function hideToast(){$('#toast').hidden=true}

/* ---------- Icons ---------- */
const I={
  left:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
  right:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>',
  chev:'<svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>',
  cam:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.6"/></svg>',
  pics:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-9 9"/></svg>',
  bowl:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11h18a9 9 0 0 1-18 0z"/><path d="M9 7c0-1.5 1-2 1-3.5M14 7c0-1.5 1-2 1-3.5"/></svg>',
  more:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><path d="M16.75 14v5.5M14 16.75h5.5"/></svg>',
  plus:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><path d="M12 8v8M8 12h8"/></svg>',
  check:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  down:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>',
  up:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20V9M7 14l5-5 5 5M5 4h14"/></svg>',
  doc:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/></svg>'
};

/* ---------- Views ---------- */
function dayTitle(k){
  const t=todayKey();
  if(k===t)return ['Heute',fmtLong.format(parseDay(k))];
  if(k===addDays(t,-1))return ['Gestern',fmtLong.format(parseDay(k))];
  return [fmtLong.format(parseDay(k)),String(parseDay(k).getFullYear())];
}
function viewTag(){
  const isToday=S.day===todayKey();
  const list=S.entries.filter(e=>e.day===S.day).sort((a,b)=>a.ts-b.ts);
  const counts={},mc={};list.forEach(e=>{if(e.type==='symptom')counts[e.sym]=(counts[e.sym]||0)+1;if(e.type==='measure')mc[e.mea]=(mc[e.mea]||0)+1});
  const dd=S.days.get(S.day)||{};
  const cried=dd.cried==null?null:dd.cried;
  const stress=dd.stress==null?null:dd.stress;
  const flow=dd.flow||null;
  const cd=cycleDay(S.day);
  const [t,sub]=dayTitle(S.day);
  const visible=S.symptoms.filter(s=>!s.hidden);
  const visM=S.measures.filter(m=>!m.hidden);
  return `
  <header class="dayhead">
    <div><h1>${esc(t)}</h1><p class="sub">${esc(sub)}${cd?' · Zyklustag '+cd:''}</p></div>
    <div class="daynav">
      <button class="icon-btn" data-act="prev" aria-label="Vorheriger Tag">${I.left}</button>
      ${isToday?'':'<button class="pill" data-act="today">Heute</button>'}
      <button class="icon-btn" data-act="next" aria-label="Nächster Tag" ${isToday?'disabled':''}>${I.right}</button>
    </div>
  </header>

  <section aria-labelledby="h-food">
    <h2 class="label" id="h-food">Essen</h2>
    <label class="snap">
      <input type="file" id="in-camera" class="vh" accept="image/*" capture="environment" data-file="1">
      <span class="snap-ico">${I.cam}</span>
      <span><strong>Essen fotografieren</strong><small>${isToday?'Uhrzeit wird automatisch gespeichert':'Uhrzeit wählst du danach'}</small></span>
    </label>
    <div class="row2">
      <label class="btn2"><input type="file" id="in-library" class="vh" accept="image/*" multiple data-file="1">${I.pics}Aus Mediathek</label>
      <button class="btn2" data-act="nophoto">${I.bowl}Ohne Foto</button>
    </div>
    ${reuseHTML()}
  </section>

  <section aria-labelledby="h-sym">
    <div class="sec-head"><h2 class="label" id="h-sym">Symptome</h2><span class="hint">${isToday?'Antippen trägt es mit jetziger Uhrzeit ein':'Antippen, dann Uhrzeit wählen'}</span></div>

      ${S.addingSym?'':`<button class="sym sym-add${visible.length%2?' half':''}" data-act="addsym-open">+ Eigenes Symptom</button>`}
    </div>
    ${S.addingSym?`<form class="addsym" id="addsym-form">
      <label for="addsym-name" class="vh">Name des Symptoms</label>
      <input id="addsym-name" placeholder="z. B. Übelkeit" maxlength="40" autocomplete="off" enterkeyhint="done">
      <button type="submit" class="btn-accent">Hinzufügen</button>
      <button type="button" class="btn-ghost" data-act="addsym-close">Abbrechen</button>

  <section aria-labelledby="h-mea">

      ${visM.map(m=>`<button class="sym mea" data-act="mea" data-id="${esc(m.id)}" style="--c:var(--measure)">${I.plus}<span>${esc(m.name)}</span>${mc[m.id]?`<span class="count" aria-label="${mc[m.id]} Mal">${mc[m.id]}×</span>`:'<span></span>'}</button>`).join('')}
      ${S.addingMea?'':`<button class="sym sym-add${visM.length%2?' half':''}" data-act="addmea-open">+ Eigene Maßnahme</button>`}
    </div>
    ${S.addingMea?`<form class="addsym" id="addmea-form">
      <label for="addmea-name" class="vh">Name der Maßnahme</label>
      <input id="addmea-name" placeholder="z. B. Iberogast" maxlength="40" autocomplete="off" enterkeyhint="done">
      <button type="submit" class="btn-accent">Hinzufügen</button>
      <button type="button" class="btn-ghost" data-act="addmea-close">Abbrechen</button>
    </form>`:''}
  </section>

  <section aria-labelledby="h-cry">
    <h2 class="label" id="h-cry">${isToday?'Heute geweint?':'An diesem Tag geweint?'}</h2>
    <div class="seg" role="group" aria-labelledby="h-cry">
      <button data-act="cry" data-v="no" aria-pressed="${cried===false}">Nein</button>
      <button class="yes" data-act="cry" data-v="yes" aria-pressed="${cried===true}">Ja</button>
    </div>
  </section>

  <section aria-labelledby="h-stress">
    <div class="sec-head"><h2 class="label" id="h-stress">${isToday?'Stresslevel heute':'Stresslevel an diesem Tag'}</h2><span class="hint">0 = kein Stress, 4 = extrem</span></div>
    <div class="seg seg5" role="group" aria-labelledby="h-stress">
      ${STRESS.map((l,i)=>`<button class="stress" data-act="stress" data-v="${i}" aria-pressed="${stress===i}" aria-label="${i}, ${l}"><b>${i}</b><small>${l}</small></button>`).join('')}
    </div>
  </section>

function rcard(e,meta,done){
  const name=(e.note||'').trim();
  return `<button class="rcard" data-act="repeat" data-id="${e.id}" aria-label="Nochmal eintragen: ${esc(name||'Mahlzeit, '+meta)}${done?', schon eingetragen':''}">
    <span class="rimg">${e.thumb?`<img src="${e.thumb}" alt="">`:I.bowl}${done?`<span class="done" title="Schon eingetragen">${I.check}</span>`:''}</span>
    <span class="rname">${esc(name||'Ohne Namen')}</span><span class="rmeta">${esc(meta)}</span></button>`;
}
function reuseHTML(){
  const prev=addDays(S.day,-1);
  const doneKeys=new Set(S.entries.filter(e=>e.day===S.day&&e.type==='food').map(mealKey));
  const seen=new Set();
  const y=S.entries.filter(e=>e.day===prev&&reusable(e)).sort((a,b)=>a.ts-b.ts)
    .filter(e=>{const k=mealKey(e);if(seen.has(k))return false;seen.add(k);return true});
  const older=S.entries.some(e=>reusable(e)&&e.day!==S.day);
  if(!y.length&&!older)return '';
  const head=y.length?(S.day===todayKey()?'Von gestern nochmal':'Vom Vortag nochmal'):'Nochmal essen';
  return `<div class="reuse">
    <div class="sec-head"><h3 class="flabel">${head}</h3><span class="hint">Antippen trägt es erneut ein</span></div>
    <div class="strip">${y.map(e=>rcard(e,hhmm(e.ts)+' Uhr',doneKeys.has(mealKey(e)))).join('')}
      <button class="rcard more" data-act="picker"><span class="rimg">${I.more}</span><span class="rname">Frühere Mahlzeiten</span><span class="rmeta">alle anzeigen</span></button>
    </div>
  </div>`;
}
function itemHTML(e){

  </button></li>`;
}
function viewVerlauf(){
  const end=todayKey();
  const days=[...Array(14)].map((_,i)=>addDays(end,i-13));
  const inWin=new Set(days);
  const by={};S.entries.forEach(e=>{(by[e.day]=by[e.day]||[]).push(e)});
  const symIds=new Set(S.symptoms.filter(s=>!s.hidden).map(s=>s.id));
  S.entries.forEach(e=>{if(e.type==='symptom'&&inWin.has(e.day))symIds.add(e.sym)});
  const rows=S.symptoms.filter(s=>symIds.has(s.id));
  // symptoms whose type was removed but still appear
  S.entries.forEach(e=>{if(e.type==='symptom'&&inWin.has(e.day)&&!rows.some(r=>r.id===e.sym))rows.push({id:e.sym,name:e.name,color:e.color||5})});
  const meaIds=new Set(S.measures.filter(m=>!m.hidden).map(m=>m.id));
  S.entries.forEach(e=>{if(e.type==='measure'&&inWin.has(e.day))meaIds.add(e.mea)});
  const mrows=S.measures.filter(m=>meaIds.has(m.id));
  S.entries.forEach(e=>{if(e.type==='measure'&&inWin.has(e.day)&&!mrows.some(r=>r.id===e.mea))mrows.push({id:e.mea,name:e.name})});
  const cnt=(d,f)=>(by[d]||[]).filter(f).length;
  const cell=(n,color)=>{
    if(!n)return '<span class="cell zero"></span>';
    const p=Math.min(100,45+n*20);
    return `<span class="cell" style="--c:var(${color});--p:${p}%">${n>1?n:''}</span>`;
  };
  const symDays=days.filter(d=>cnt(d,e=>e.type==='symptom')>0).length;
  const cryDays=days.filter(d=>{const c=S.days.get(d);return c&&c.cried===true}).length;
  const meals=days.reduce((a,d)=>a+cnt(d,e=>e.type==='food'),0);
  const stressVals=days.map(d=>(S.days.get(d)||{}).stress).filter(v=>v!=null);
  const stressAvg=stressVals.length?(stressVals.reduce((a,b)=>a+b,0)/stressVals.length).toFixed(1).replace('.',','):null;
  const head=days.map(d=>{const dt=parseDay(d);return `<th scope="col" class="${d===end?'is-today':''}">${esc(fmtWd.format(dt).replace('.',''))}<span class="dn">${dt.getDate()}</span></th>`}).join('');
  const body=rows.map(s=>`<tr><th scope="row">${esc(s.name)}</th>${days.map(d=>{const n=cnt(d,e=>e.type==='symptom'&&e.sym===s.id);return `<td title="${esc(s.name)}, ${fmtDE(d)}: ${n}×">${cell(n,'--sym'+s.color)}</td>`}).join('')}</tr>`).join('')
    +mrows.map(m=>`<tr><th scope="row"><span class="dia"></span>${esc(m.name)}</th>${days.map(d=>{const n=cnt(d,e=>e.type==='measure'&&e.mea===m.id);return `<td title="${esc(m.name)}, ${fmtDE(d)}: ${n}×">${cell(n,'--measure')}</td>`}).join('')}</tr>`).join('')
    +`<tr><th scope="row">Geweint</th>${days.map(d=>{const c=S.days.get(d);
        if(!c||c.cried==null)return '<td><span class="cell zero"></span></td>';
        return c.cried?'<td title="Geweint"><span class="cell" style="--c:var(--cry);--p:100%"></span></td>':'<td title="Nicht geweint"><span class="cell no"></span></td>'}).join('')}</tr>`
    +`<tr><th scope="row">Stress</th>${days.map(d=>{const v=(S.days.get(d)||{}).stress;
        if(v==null)return '<td><span class="cell zero"></span></td>';
        return `<td title="Stress ${v}, ${STRESS[v]}"><span class="cell${v<=1?' lo':''}" style="--c:var(--stress);--p:${STRESS_P[v]}%">${v}</span></td>`}).join('')}</tr>`
    +`<tr><th scope="row">Periode</th>${days.map(d=>{const f=(S.days.get(d)||{}).flow;
        if(!f||f==='none')return `<td${f?' title="Keine Periode"':''}><span class="cell zero"></span></td>`;
        return `<td title="${FLOW_TXT[f]}"><span class="cell" style="--c:var(--period);--p:${FLOW_P[f]}%"></span></td>`}).join('')}</tr>`
    +`<tr><th scope="row">Mahlzeiten</th>${days.map(d=>`<td>${cell(cnt(d,e=>e.type==='food'),'--muted')}</td>`).join('')}</tr>`;

  const recent=[...new Set([...Object.keys(by),...S.days.keys()])].filter(d=>d<=end&&d>=addDays(end,-59)).sort().reverse();
  const dayRows=recent.map(d=>{
    const es=(by[d]||[]).slice().sort((a,b)=>a.ts-b.ts);
    const c={};es.forEach(e=>{if(e.type==='symptom')c[e.sym]=(c[e.sym]||0)+1});
    const chips=Object.keys(c).map(id=>{const s=symOf(es.find(e=>e.sym===id));return `<span class="chip"><span class="dot" style="--c:var(--sym${s.color})"></span>${esc(s.name)}${c[id]>1?' '+c[id]+'×':''}</span>`});
    const mcn={};es.forEach(e=>{if(e.type==='measure')mcn[e.mea]=(mcn[e.mea]||0)+1});
    Object.keys(mcn).forEach(id=>chips.push(`<span class="chip"><span class="dia"></span>${esc(meaOf(es.find(e=>e.mea===id)).name)}${mcn[id]>1?' '+mcn[id]+'×':''}</span>`));
    const cr=S.days.get(d)||{};
    if(cr.cried===true)chips.push('<span class="chip"><span class="dot" style="--c:var(--cry)"></span>Geweint</span>');
    if(cr.flow&&cr.flow!=='none')chips.push(`<span class="chip"><span class="dot" style="--c:var(--period)"></span>${FLOW_TXT[cr.flow]}</span>`);
    if(cr.stress!=null)chips.push(`<span class="chip"><span class="dot" style="--c:var(--stress)"></span>Stress ${cr.stress} · ${STRESS[cr.stress]}</span>`);
    const th=es.filter(e=>e.thumb).slice(0,3).map(e=>`<img src="${e.thumb}" alt="">`).join('');
    const [t,sub]=dayTitle(d);
    const meals=es.filter(e=>e.type==='food').length;
    return `<li><button class="dayrow" data-act="goto" data-day="${d}">
      <span><strong>${esc(t)}</strong><small>${d===end||d===addDays(end,-1)?esc(sub)+' · ':''}${meals} ${meals===1?'Mahlzeit':'Mahlzeiten'}</small></span>
      <span class="thumbs">${th}</span>
      ${chips.length?`<span class="chips">${chips.join('')}</span>`:''}
    </button></li>`;
  }).join('');

  return `
  <header><h1>Verlauf</h1><p class="sub">Die letzten 14 Tage auf einen Blick</p></header>
  <section aria-labelledby="h-sum">
    <h2 class="vh" id="h-sum">Zusammenfassung</h2>
    <p class="summary">An <b>${symDays}</b> von 14 Tagen hattest du Symptome, an <b>${cryDays}</b> Tagen hast du geweint. <b>${meals}</b> Mahlzeiten sind eingetragen.${stressAvg?` Dein Stress lag im Schnitt bei <b>${stressAvg}</b> von 4.`:''}</p>
  </section>
  <section aria-labelledby="h-mx">
    <h2 class="label" id="h-mx">Pro Tag</h2>
    <div class="matrix-wrap"><table class="matrix"><thead><tr><th scope="col"><span class="vh">Eintrag</span></th>${head}</tr></thead><tbody>${body}</tbody></table></div>
    <div class="legend"><span><span class="cell" style="--c:var(--sym3);--p:65%"></span>einmal</span><span><span class="cell" style="--c:var(--sym3);--p:100%"></span>öfter (Zahl = Anzahl)</span><span><span class="cell no"></span>nicht geweint</span></div>
  </section>
  ${cycleHTML()}
  <section aria-labelledby="h-days">
    <h2 class="label" id="h-days">Einzelne Tage</h2>
    ${dayRows?`<ul class="daylist">${dayRows}</ul>`:'<p class="empty">Sobald du etwas einträgst, erscheinen die Tage hier.</p>'}
  </section>`;
}
function cycleHTML(){
  const starts=periodStarts();
  const headH='<h2 class="label" id="h-cyc">Bauch und Zyklus</h2>';
  if(!starts.length)return `<section aria-labelledby="h-cyc">${headH}<p class="empty">Sobald du eine Periode einträgst, siehst du hier, ob deine Beschwerden mit dem Zyklus zusammenhängen.</p></section>`;
  const end=todayKey(),from=addDays(end,-179);
  const symBy={};
  S.entries.forEach(e=>{if(e.type==='symptom'&&e.day>=from&&e.day<=end)(symBy[e.day]=symBy[e.day]||new Set()).add(e.sym)});
  const tracked=new Set([...S.entries.map(e=>e.day),...S.days.keys()].filter(d=>d>=from&&d<=end));
  const pre=new Set();starts.forEach(st=>{for(let i=1;i<=5;i++)pre.add(addDays(st,-i))});
  const G={periode:[],vorher:[],sonst:[]};
  tracked.forEach(d=>{if(bleeding(d))G.periode.push(d);else if(pre.has(d))G.vorher.push(d);else G.sonst.push(d)});
  const order=['periode','vorher','sonst'];
  const pct=(g,f)=>G[g].length?Math.round(G[g].filter(f).length/G[g].length*100):null;
  const ids=new Set();Object.values(symBy).forEach(x=>x.forEach(i=>ids.add(i)));
  const syms=[...S.symptoms.filter(x=>ids.has(x.id))];
  ids.forEach(id=>{if(!syms.some(x=>x.id===id)){const e=S.entries.find(y=>y.sym===id);syms.push({id,name:e.name,color:e.color||5})}});
  const cellH=(v,c)=>v==null?'<td><span class="pc na">–</span></td>':`<td><span class="pc" style="--c:var(${c});--v:${v}%">${v} %</span></td>`;
  const rows=[`<tr><th scope="row">Irgendein Symptom</th>${order.map(g=>cellH(pct(g,d=>!!symBy[d]),'--accent')).join('')}</tr>`]
    .concat(syms.map(x=>`<tr><th scope="row"><span class="dot" style="--c:var(--sym${x.color})"></span>${esc(x.name)}</th>${order.map(g=>cellH(pct(g,d=>symBy[d]&&symBy[d].has(x.id)),'--sym'+x.color)).join('')}</tr>`)).join('');
  const lab={periode:'Während der Periode',vorher:'5 Tage davor',sonst:'Übrige Tage'};
  const last=starts[starts.length-1];
  const lens=starts.slice(1).map((x,i)=>daysBetween(starts[i],x)).filter(n=>n>=15&&n<=60);
  const few=order.some(g=>G[g].length<10);
  return `<section aria-labelledby="h-cyc">${headH}
    <p class="prose">Letzte Periode begann am <b>${fmtDE(last)}</b>.${lens.length?` Dein letzter Zyklus dauerte <b>${lens[lens.length-1]}</b> Tage${lens.length>1?`, im Schnitt <b>${Math.round(lens.reduce((a,b)=>a+b,0)/lens.length)}</b>`:''}.`:''}</p>
    <p class="hint">Anteil der eingetragenen Tage mit diesem Symptom, letzte 6 Monate</p>
    <div class="cyc-wrap"><table class="cyc"><thead><tr><th scope="col"><span class="vh">Symptom</span></th>${order.map(g=>`<th scope="col">${lab[g]}<small>${G[g].length} ${G[g].length===1?'Tag':'Tage'}</small></th>`).join('')}</tr></thead>
    <tbody>${rows}</tbody></table></div>
    ${few?'<p class="hint">Noch wenige Tage eingetragen. Je länger du die App nutzt, desto aussagekräftiger werden die Werte.</p>':''}
  </section>`;
}

function focusKey(el){return el&&main.contains(el)?[el.dataset.act,el.dataset.id,el.dataset.v,el.dataset.day,el.id].join('|'):null}
function render(){
  const k=focusKey(document.activeElement);
  let html=S.storageOk?'':'<p class="banner">Speichern ist in diesem Browser gerade nicht möglich. Einträge gehen verloren, sobald du die Seite schließt.</p>';
  html+=S.view==='tag'?viewTag():S.view==='verlauf'?viewVerlauf():viewDaten();
  main.innerHTML=html;
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-current',t.dataset.tab===S.view?'page':'false'));
  if(S.addingSym&&S.view==='tag'){const i=$('#addsym-name');if(i)i.focus();return}
  if(S.addingMea&&S.view==='tag'){const i=$('#addmea-name');if(i)i.focus();return}
  if(k){const el=[...main.querySelectorAll('button,input,textarea')].find(x=>focusKey(x)===k);if(el)el.focus({preventScroll:true})}
  if(S.view==='daten')showUsage();
}
async function showUsage(){
  const el=$('#usage');if(!el)return;
  try{const e=await navigator.storage.estimate();el.textContent=(e.usage/1048576).toFixed(1).replace('.',',')+' MB'}
  catch(err){el.textContent='unbekannt'}
}

      <div class="seg seg3" role="group" aria-labelledby="ed-sev-l">${SEV.map(v=>`<button type="button" data-ed="sev" data-v="${v.v}" aria-pressed="${e.sev===v.v}">${v.l}</button>`).join('')}</div></div>`:''}
    ${m?`<div class="field"><span class="flabel" id="ed-why-l">Anlass <span class="opt">optional</span></span>
      <div class="seg" role="group" aria-labelledby="ed-why-l">${Object.keys(WHY).map(k=>`<button type="button" data-ed="why" data-v="${k}" aria-pressed="${e.why===k}">${WHY[k]}</button>`).join('')}</div></div>`:''}
    <div class="field"><label for="ed-note">${e.type==='food'?'Name':'Notiz'} <span class="opt">optional</span></label>
      <textarea id="ed-note" rows="2" placeholder="${e.type==='food'?'z. B. Haferflocken mit Banane':e.type==='measure'?'z. B. 1 Tablette':'z. B. nach dem Kaffee'}">${esc(e.note)}</textarea></div>
    ${ed.confirm?`<div class="confirm" role="alert"><span>Diesen Eintrag löschen?</span><button type="button" class="btn-ghost" data-ed="del-no">Behalten</button><button type="button" class="btn-danger" data-ed="del-yes">Löschen</button></div>`
      :`<div class="panel-foot"><button type="button" class="btn-ghost danger-text" data-ed="del">Löschen</button><button type="button" class="btn-accent" data-ed="done">Fertig</button></div>`}`;
}
function flushNote(){
  clearTimeout(noteTimer);
  const ta=$('#ed-note');if(!ta||!ed)return;
  const e=S.entries.find(x=>x.id===ed.id);
  if(e&&e.note!==ta.value){e.note=ta.value;saveEntry(e)}
}
function closeEditor(){
  if(!ed)return;flushNote();
  if(ed.photoURL)URL.revokeObjectURL(ed.photoURL);
  ed=null;sheet.hidden=true;main.inert=false;document.querySelector('.tabbar').inert=false;panel.innerHTML='';
  render();
  if(lastFocus&&document.contains(lastFocus))lastFocus.focus({preventScroll:true});
}
panel.addEventListener('click',async ev=>{
  const b=ev.target.closest('[data-ed],[data-act="repeat"]');if(!b||!ed)return;
  if(b.dataset.act==='repeat'){const id=b.dataset.id;closeEditor();repeatMeal(id);return}
  if(b.dataset.ed==='close'){closeEditor();return}
  const e=S.entries.find(x=>x.id===ed.id);if(!e)return;
  const a=b.dataset.ed;
  if(a==='sev'){const v=+b.dataset.v;e.sev=e.sev===v?null:v;
    panel.querySelectorAll('[data-ed="sev"]').forEach(x=>x.setAttribute('aria-pressed',String(+x.dataset.v===e.sev)));saveEntry(e)}
  else if(a==='why'){const v=b.dataset.v;e.why=e.why===v?null:v;
    panel.querySelectorAll('[data-ed="why"]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.v===e.why)));saveEntry(e)}
  else if(a==='done')closeEditor();
  else if(a==='del'){flushNote();ed.confirm=true;renderEditor();const n=panel.querySelector('[data-ed="del-no"]');if(n)n.focus()}
  else if(a==='del-no'){ed.confirm=false;renderEditor();const d=panel.querySelector('[data-ed="del"]');if(d)d.focus()}
  else if(a==='del-yes'){const id=ed.id;if(ed.photoURL)URL.revokeObjectURL(ed.photoURL);ed=null;sheet.hidden=true;main.inert=false;document.querySelector('.tabbar').inert=false;await removeEntry(id,'Eintrag gelöscht')}
});
function onTime(ev){
  if(ev.target.id!=='ed-time'||!ed||!ev.target.value)return;
  const e=S.entries.find(x=>x.id===ed.id);if(!e)return;
  const [h,m]=ev.target.value.split(':').map(Number);
  const ts=parseDay(e.day).setHours(h,m,0,0);
  if(ts!==e.ts){e.ts=ts;saveEntry(e)}
}
panel.addEventListener('change',onTime);
panel.addEventListener('input',ev=>{
  if(ev.target.id==='ed-note'){clearTimeout(noteTimer);noteTimer=setTimeout(flushNote,500)}
  else onTime(ev);
});
sheet.addEventListener('click',ev=>{if(ev.target.dataset.close)closeEditor()});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&ed)closeEditor()});

/* ---------- Backup and export ---------- */
function blobToDataURL(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(b)})}
function dataURLToBlob(u){const [h,d]=u.split(',');const mime=(h.match(/data:([^;]+)/)||[])[1]||'image/jpeg';const bin=atob(d);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:mime})}
async function deliver(blob,name){
  try{
    const file=new File([blob],name,{type:blob.type});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return}
  }catch(e){if(e&&e.name==='AbortError')return}
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),5000);
  toast(name+' wurde erstellt.');
}
async function exportBackup(){
  toast('Backup wird erstellt …');
  const entries=[],seenPhotos=new Set();
  for(const e of S.entries){const x=Object.assign({},e);
    if(e.hasPhoto&&!seenPhotos.has(pk(e))){try{const b=await store.get('photos',pk(e));if(b){x.photo=await blobToDataURL(b);seenPhotos.add(pk(e))}}catch(err){}}
    entries.push(x)}
  const data={app:'bauchbuch',version:1,exportedAt:new Date().toISOString(),symptoms:S.symptoms,measures:S.measures,days:[...S.days.values()],entries};
  await deliver(new Blob([JSON.stringify(data)],{type:'application/json'}),'bauchbuch-backup-'+todayKey()+'.json');
}
async function importBackup(file){
  let data;
  try{data=JSON.parse(await file.text())}catch(e){toast('Die Datei ist kein lesbares Backup.');return}
  if(!data||data.app!=='bauchbuch'||!Array.isArray(data.entries)){toast('Das ist kein Bauchbuch-Backup.');return}
  let n=0;
  try{
    for(const x of data.entries){
      const e=Object.assign({},x);const photo=e.photo;delete e.photo;
      if(photo)await store.put('photos',dataURLToBlob(photo),pk(e));
      await store.put('entries',e);
      const i=S.entries.findIndex(y=>y.id===e.id);if(i>=0)S.entries[i]=e;else S.entries.push(e);n++;
    }
    for(const d of data.days||[]){await store.put('days',d);S.days.set(d.day,d)}
    for(const s of data.symptoms||[]){if(!S.symptoms.some(y=>y.id===s.id))S.symptoms.push(s)}
    for(const m of data.measures||[]){if(!S.measures.some(y=>y.id===m.id))S.measures.push(m)}
    await store.put('meta',{k:'measures',list:S.measures});
    await store.put('meta',{k:'symptoms',list:S.symptoms});
  }catch(e){toast('Beim Einspielen ist etwas schiefgelaufen. '+n+' Einträge wurden übernommen.');render();return}
  render();toast(n+' Einträge übernommen.');
}
function exportCSV(){
  const rows=[['Datum','Uhrzeit','Art','Eintrag','Stärke','Anlass','Notiz']];
  const sorted=S.entries.slice().sort((a,b)=>a.ts-b.ts);
  const all=[...new Set([...sorted.map(e=>e.day),...S.days.keys()])].sort();
  all.forEach(d=>{
    const c=S.days.get(d);
    if(c&&c.cried!=null)rows.push([fmtDE(d),'','Weinen',c.cried?'Geweint':'Nicht geweint','','','']);
    if(c&&c.flow)rows.push([fmtDE(d),'','Periode',FLOW_TXT[c.flow],'','','']);
    if(c&&c.stress!=null)rows.push([fmtDE(d),'','Stress',c.stress+' von 4 ('+STRESS[c.stress]+')','','','']);
    sorted.filter(e=>e.day===d).forEach(e=>rows.push([fmtDE(d),hhmm(e.ts),
      e.type==='food'?'Essen':e.type==='measure'?'Maßnahme':'Symptom',
      e.type==='food'?(e.hasPhoto?'Mahlzeit (mit Foto)':'Mahlzeit'):e.type==='measure'?meaOf(e).name:symOf(e).name,
      e.sev?SEV[e.sev-1].l:'',e.why?WHY[e.why]:'',e.note||'']));
  });
  const csv=rows.map(r=>r.map(v=>{v=String(v);return /[;"\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(';')).join('\r\n');
  deliver(new Blob(['﻿'+csv],{type:'text/csv'}),'bauchbuch-uebersicht-'+todayKey()+'.csv');
}

/* ---------- Events ---------- */
main.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  if(a==='prev'){S.day=addDays(S.day,-1);render()}
  else if(a==='next'){if(S.day<todayKey()){S.day=addDays(S.day,1);render()}}
  else if(a==='today'){S.day=todayKey();render()}
  else if(a==='sym')logSymptom(b.dataset.id,b);
  else if(a==='mea')logMeasure(b.dataset.id);
  else if(a==='cry')setDay('cried',b.dataset.v==='yes');
  else if(a==='stress')setDay('stress',+b.dataset.v);
  else if(a==='flow')setDay('flow',b.dataset.v);
  else if(a==='edit')openEditor(b.dataset.id);
  else if(a==='nophoto')addMealNoPhoto();
  else if(a==='repeat')repeatMeal(b.dataset.id);
  else if(a==='picker')openPicker();
  else if(a==='addsym-open'){S.addingSym=true;S.addingMea=false;render()}
  else if(a==='addsym-close'){S.addingSym=false;render()}
  else if(a==='addmea-open'){S.addingMea=true;S.addingSym=false;render()}
  else if(a==='addmea-close'){S.addingMea=false;render()}
  else if(a==='goto'){S.day=b.dataset.day;S.view='tag';render();window.scrollTo(0,0)}
  else if(a==='backup')exportBackup();
  else if(a==='csv')exportCSV();
  else if(a==='meatoggle'){const m=S.measures.find(x=>x.id===b.dataset.id);if(m){m.hidden=!m.hidden;render();saveMeasures()}}
  else if(a==='symtoggle'){const s=S.symptoms.find(x=>x.id===b.dataset.id);if(s){s.hidden=!s.hidden;render();saveSymptoms()}}
});
main.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.dataset.file){const f=t.files;if(f&&f.length)addPhotos(f).finally(()=>{t.value=''})}
  if(t.dataset.restore){const f=t.files&&t.files[0];if(f)importBackup(f).finally(()=>{t.value=''})}
});
main.addEventListener('submit',ev=>{
  if(ev.target.id==='addsym-form'){ev.preventDefault();addSymptom($('#addsym-name').value)}
  else if(ev.target.id==='addmea-form'){ev.preventDefault();addMeasure($('#addmea-name').value)}
});
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  S.view=t.dataset.tab;S.addingSym=false;S.addingMea=false;render();window.scrollTo(0,0);
}));
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible')return;
  const t=todayKey();
  if(S.lastToday&&S.lastToday!==t&&S.day===S.lastToday){S.day=t;if(!ed)render()}
  S.lastToday=t;
});

/* ---------- Start ---------- */
async function init(){
  S.lastToday=todayKey();
  try{db=await openDB()}catch(e){db=null;S.storageOk=false}
  try{S.entries=await store.all('entries')}catch(e){S.entries=[]}
  try{(await store.all('days')).forEach(d=>S.days.set(d.day,d))}catch(e){}
  let sm=null;try{sm=await store.get('meta','symptoms')}catch(e){}
  S.symptoms=sm&&Array.isArray(sm.list)?sm.list:DEFAULT_SYMPTOMS.map(s=>Object.assign({},s));
  let mm=null;try{mm=await store.get('meta','measures')}catch(e){}
  S.measures=mm&&Array.isArray(mm.list)?mm.list:DEFAULT_MEASURES.map(m=>Object.assign({},m));
  // Update from the single pain button to "leicht" and "stark"; old entries keep their name
  const oldPain=S.symptoms.findIndex(s=>s.id==='bauchschmerzen');
  if(oldPain>=0&&!S.symptoms.some(s=>s.id==='bauchschmerzen-leicht')){
    S.symptoms[oldPain].hidden=true;
    S.symptoms.splice(oldPain+1,0,...NEW_PAIN.map(s=>Object.assign({},s)));
    saveSymptoms();
  }
  render();
  try{if(navigator.storage&&navigator.storage.persisted){S.persistent=await navigator.storage.persisted();
    if(!S.persistent&&navigator.storage.persist)S.persistent=await navigator.storage.persist()}}catch(e){}
  if(!inFrame&&'serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
}
init();
})();
